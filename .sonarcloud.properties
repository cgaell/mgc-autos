sonar.projectKey=cgaell_mgc-autos
sonar.organization=cgaell

# Código fuente (src) excluyendo la subcarpeta de tests
sonar.sources=src
sonar.exclusions=src/tests/**,**/coverage/**,**/node_modules/**,**/public/**

# Pruebas unitarias
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.js

# Reporte de cobertura LCOV generado por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info